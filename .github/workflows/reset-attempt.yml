name: Reset Auto-Fix Attempts

on:
  issue_comment:
    types: [created]

jobs:
  reset:
    name: Reset Attempts
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/reset-attempt')
    runs-on: ubuntu-latest
    steps:
      - name: Remove Attempt Labels
        run: |
          for i in 1 2 3; do
            gh pr edit ${{ github.event.issue.number }} \
              --remove-label "auto-fix-attempt-$i" 2>/dev/null || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: React to Comment
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='+1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-run Latest Pipeline
        run: |
          # Get the latest workflow run for this PR's head branch
          PR_DATA=$(gh pr view ${{ github.event.issue.number }} --json headRefName)
          BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')

          RUN_ID=$(gh run list --branch "$BRANCH" --workflow "PR Pipeline" --limit 1 --json databaseId --jq '.[0].databaseId')

          if [ -n "$RUN_ID" ]; then
            gh run rerun "$RUN_ID"
            echo "Re-triggered run: $RUN_ID"
          else
            echo "No previous run found to re-trigger"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Confirmation
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --body "🔄 Auto-fix attempts reset. CI re-triggered."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
